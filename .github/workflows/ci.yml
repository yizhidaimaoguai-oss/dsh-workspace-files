name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - if: runner.os == 'Linux' && matrix.node == 24
        run: npm run package
      - if: runner.os == 'Linux' && matrix.node == 24
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.tgz
            dist/*.vsix
            dist/SHA256SUMS
